<div class="d-flex flex-column min-vh-100">
  <!-- Top Navigation Header -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
    <div class="container-fluid px-3 px-md-5">
      <a class="navbar-brand d-flex align-items-center fw-bold" routerLink="/">
        <span class="d-inline-flex align-items-center justify-content-center bg-primary rounded-3 text-white p-2 me-2" style="width: 36px; height: 36px;">
          <i class="bi bi-boxes"></i>
        </span>
        <span class="fs-5 tracking-tight">StockFlow <span class="text-primary fw-light">Inventory</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <!-- Navigation Links -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item" *ngIf="authService.isLoggedIn()">
            <a class="nav-link px-3" routerLink="/products" routerLinkActive="active text-primary fw-semibold">
              <i class="bi bi-grid me-1"></i> Products Dashboard
            </a>
          </li>
        </ul>

        <!-- Right Side: Auth buttons / User Profile -->
        <div class="d-flex align-items-center gap-2">
          <!-- When Logged Out -->
          <ng-container *ngIf="!authService.isLoggedIn()">
            <a routerLink="/login" class="btn btn-outline-light btn-sm px-3" routerLinkActive="active">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </a>
            <a routerLink="/register" class="btn btn-primary btn-sm px-3" routerLinkActive="active">
              <i class="bi bi-person-plus me-1"></i> Register
            </a>
          </ng-container>

          <!-- When Logged In -->
          <ng-container *ngIf="authService.isLoggedIn()">
            <div class="d-flex align-items-center bg-secondary bg-opacity-25 rounded-pill px-3 py-1 me-2 text-white">
              <i class="bi bi-person-circle fs-5 me-2 text-primary"></i>
              <div class="small lh-sm text-start">
                <div class="fw-semibold">{{ authService.getCurrentUser()?.email }}</div>
                <div class="text-white-50" style="font-size: 0.75rem;">Role: {{ authService.getCurrentUser()?.role || 'Staff' }}</div>
              </div>
            </div>

            <button class="btn btn-outline-danger btn-sm rounded-pill px-3" (click)="logout()" title="Logout of current session">
              <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
          </ng-container>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main View Area -->
  <main class="flex-grow-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    <div class="container">
      <span>&copy; 2026 <strong>Inventory Management System</strong> &bull; Angular 22 &amp; Spring Boot REST API &bull; Port: 8088</span>
    </div>
  </footer>
</div>
